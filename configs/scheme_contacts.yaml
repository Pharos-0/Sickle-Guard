deadlines:
- applies_to: localised calamity (hailstorm, landslide, inundation, cloudburst)
    and post-harvest loss
  limit: report within 72 hours of the event
  verified: false
  note: 'Individual-farm assessment applies to these. Late intimation is a common
    ground for rejection, so a farmer should report immediately and not wait for
    any model output, including this one.

    '
- applies_to: widespread loss across a notified area (e.g. drought, flood)
  limit: no individual intimation required
  verified: false
  note: 'Settled on area-yield data from crop-cutting experiments at the Insurance
    Unit. An individual field estimate, including this system''s, has no standing
    in that process.

    '
mandatory_notices:
  never_discourage: 'This system CANNOT tell you whether you have a valid claim.
    If you believe your crop was damaged, report it through the official channels
    within the deadline, whatever this report says.

    '
  not_official: 'This is a research prototype. It is not connected to PMFBY, is
    not an insurer, and its output has no official standing.

    '
