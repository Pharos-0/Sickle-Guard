# Every number this project's prose quotes, bound to the artefact it came
# from and to the exact string the documents must contain.
#
# WHY THIS FILE EXISTS
# --------------------
# Four documents now quote results: README.md, EVIDENCE_TO_DESIGN.md,
# ARCHITECTURE_ASSESSMENT.md and THESIS_SCOPE.md. Nothing checked that any
# of them still agreed with the artefacts. A rerun that moved a number
# would leave the prose stating the old one, and the prose is what a
# reader believes.
#
# src/check_claims.py enforces two things per entry:
#
#   VALUE   the number recomputed from the artefact still equals `expected`
#           within `tolerance`
#   PROSE   the string in `renders_as` appears verbatim in every document
#           listed in `quoted_in`
#
# The second check is the one that catches stale writing: if an artefact
# moves and `expected` is updated, the rendered string changes and every
# document quoting it fails until it is rewritten.
#
# TOLERANCES
# ----------
# Almost everything here is deterministic arithmetic over stored artefacts
# or a seeded bootstrap, so the default is exact to 1e-9. Entries whose
# value depends on a model fit that is refitted on each run carry a wider
# tolerance with the reason stated inline.

version: 1
declared_on: "2026-10-11"
default_tolerance: 1.0e-9

policy: >
  A value outside tolerance, or a document that no longer contains the
  rendered string, fails the check. Fix the document or re-derive the
  number; never edit `expected` alone to make the check pass.

