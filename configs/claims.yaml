# ---------------------------------------------------------------- prose
# Numbers are not the only thing that drifts. A claim can be overstated in
# a sentence that contains no figure at all, and that is the failure mode
# this project is most exposed to: every result so far pushes the honest
# claim DOWN, so the temptation is always to write it slightly stronger
# than the evidence.
#
# must_appear   a canonical sentence that has to be present verbatim.
# must_not_appear  phrasings the evidence rules out. These are checked
#               against every markdown file in the project, not only the
#               ones listed above, because an overstatement is just as
#               damaging in a file nobody declared.

prose_rules:
  must_appear:
    - id: synthetic_page_declares_itself
      document: SYNTHETIC_CONDITIONS.md
      text: >-
        **Every number on this page is simulated.**
      why: >
        Simulated and empirical results are kept apart. The page carrying
        the simulation says so in its opening, so a reader who arrives at
        a table mid-document cannot mistake it for field performance.
    - id: simulated_extensions_page_declares_itself
      document: SIMULATED_EXTENSIONS.md
      text: >-
        **Every number on this page is simulated.**
      why: >
        Experiments C and D are simulated. Their page says so in its
        opening, like the generator's page.
    - id: canonical_objective
      document: THESIS_SCOPE.md
      text: >-
        We identify conditions under which satellite-based agricultural
        predictions can be unreliable, empirically evaluate safeguards for
        detecting those failures, and develop a decision-support prototype
        to help prioritize verification while guarding against false
        reassurance.
      why: >
        The objective is stated once, in one place, so that every other
        document can be checked against it rather than paraphrasing it
        into something stronger.

  must_not_appear:
    - phrase: "protecting farmers from false reassurance"
      why: >
        Superseded wording. It claims an outcome for a person; nobody has
        used this system. The canonical objective says guarding against
        false reassurance, which is a property of the artefact and is
        demonstrated: no reassuring state, blind task sheets, wording
        invariant to the estimate.
    - phrase: "validated with farmers"
      why: "No farmer has used this. 82 passing tests are not a user study."
    - phrase: "ready for PMFBY"
      why: >
        No Insurance Unit identity exists in this data, so nothing here
        can reproduce a scheme decision.
    - phrase: "improves insurance"
      why: "No claim, payout or decision has been measured."
    - phrase: "proven crop-loss"
      why: >
        On the plots where the answer is not already in the record, AUROC
        is 0.626 with an interval including chance.
    - phrase: "detects crop damage"
      why: >
        The target is a relative cut on farmer-recalled yield. Documents
        may say the system does NOT do this; the checker is
        negation-aware.
    - phrase: "farmers are better off"
      why: "Ranking better than an alternative is not an outcome for anyone."
    - phrase: "eight reliability signals"
      why: >
        The count is nine: seven in reliability.json, plus the
        released-ensemble screen and the MNDWI screen. An earlier README
        table dropped `low predicted yield` and four documents repeated
        its "eight".
    - phrase: "eighth reliability signal"
      why: "Same stale count."
    - phrase: "validated against YES-TECH"
      why: "No YES-TECH output was used; none is public."
    - phrase: "YES-TECH misses"
      why: >
        Unproven. The evidence on YES-TECH's accuracy is contested and no
        matched data is public; Experiment D is a mechanism, not a finding.
    - phrase: "ready for deployment"
      why: "Nobody has used the workflow or the console in the field."
    - phrase: "detects damage"
      why: "Same reason as detects crop damage."
    - phrase: "observed recall of"
      why: >
        Simulated recall must never be written as observed. The synthetic
        study is labelled on its own page and its numbers do not appear
        beside empirical ones without that label.

